{% if user.is_authenticated and vapid_public_key %}
{# 웹 푸시 알림 토글 — 포트폴리오·관심 페이지 제목 옆. 구독은 계정 단위(두 페이지 공용). #}
<div id="pushWidget" data-vapid="{{ vapid_public_key }}" style="display:none">
  <span style="display:none">{% csrf_token %}</span>
  <button type="button" id="pushBtn" class="btn btn-sm btn-primary" style="white-space:nowrap">
    <i class="fa-solid fa-bell"></i> <span id="pushLabel">알림 받기</span>
  </button>
  <div id="pushHint" style="display:none;font-size:11.5px;color:var(--text-3);margin-top:4px;max-width:240px;line-height:1.5"></div>
</div>
<div id="pushIosGuide" style="display:none;background:var(--orange-bg);color:#8A4600;font-size:12px;border-radius:8px;padding:8px 12px;line-height:1.55;max-width:340px">
  <i class="fa-solid fa-circle-info"></i> 아이폰은 Safari <b>공유</b> 버튼 → <b>홈 화면에 추가</b> 후, 추가된 ELS 레이더 앱에서 알림을 켤 수 있어요
</div>
<script>
(function () {
  var w = document.getElementById("pushWidget");
  if (!w) return;
  var btn = document.getElementById("pushBtn"), label = document.getElementById("pushLabel"),
      icon = btn.querySelector("i"), hint = document.getElementById("pushHint"),
      ios = document.getElementById("pushIosGuide");
  var vapid = w.dataset.vapid;
  var csrf = w.querySelector("input[name=csrfmiddlewaretoken]").value;
  var supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || window.navigator.standalone === true;

  if (!supported) {
    /* iOS는 홈 화면 추가(PWA)에서만 푸시 지원 → 설치 안내로 대체 */
    if (isIos && !standalone) ios.style.display = "";
    return;
  }
  w.style.display = "";

  var BLOCKED_HINT = "브라우저 주소창 자물쇠(사이트 설정)에서 알림을 허용으로 바꾼 뒤 새로고침해주세요";
  var state = "off";
  function render(s, hintText) {
    state = s;
    btn.className = "btn btn-sm" + (s === "off" ? " btn-primary" : "");
    btn.style.background = s === "on" ? "var(--blue-bg)" : (s === "blocked" ? "var(--bg)" : "");
    btn.style.color = s === "on" ? "var(--blue-dark)" : (s === "blocked" ? "var(--text-3)" : "");
    /* 켜짐/꺼짐이 '켜짐 vs 켜기' 한 글자 차이라 구분이 안 됐다 — 아이콘까지 바꾼다 */
    icon.className = "fa-solid " + (s === "on" ? "fa-circle-check"
        : (s === "blocked" ? "fa-bell-slash" : "fa-bell"));
    label.textContent = s === "on" ? "알림 켜짐" : (s === "blocked" ? "알림 차단됨" : "알림 받기");
    setHint(hintText);
  }
  function setHint(t) {
    hint.textContent = t || "";
    hint.style.display = t ? "" : "none";
  }
  /* 권한 요청·구독 발급·발송까지 수 초 걸린다 — 그동안 버튼이 멈춘 것처럼 보이지 않게 진행 표시 */
  function busy(text, hintText) {
    icon.className = "fa-solid fa-spinner fa-spin";
    label.textContent = text;
    setHint(hintText);
  }
  function post(url, data) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
      body: JSON.stringify(data || {}),
    });
  }
  function b64ToU8(s) {
    var pad = "=".repeat((4 - s.length % 4) % 4);
    var raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(raw, function (c) { return c.charCodeAt(0); });
  }
  function getSub() {
    return navigator.serviceWorker.getRegistration("/").then(function (reg) {
      return reg ? reg.pushManager.getSubscription() : null;
    });
  }

  if (Notification.permission === "denied") {
    render("blocked", BLOCKED_HINT);
  } else {
    getSub().then(function (sub) {
      if (!sub) { render("off"); return; }
      /* 브라우저 구독이 살아있으면 '켜짐'. 서버 기록이 만료 정리 등으로 지워졌을
         수 있어 한 번 다시 보내 되살린다(자가 치유). 끄기가 제대로 동작해야
         이 재등록이 '꺼둔 알림을 되살리는' 부작용이 되지 않는다. */
      render("on");
      return post("/push/subscribe/", sub.toJSON());
    }).catch(function () {
      /* 구독 상태를 못 읽으면 버튼이 서버 렌더 기본값에 멈춰 상태를 잘못 보여준다.
         꺼짐으로 되돌려 최소한 사용자가 다시 켤 수 있게 한다. */
      render("off");
    });
  }

  btn.addEventListener("click", function () {
    if (state === "blocked") return;
    if (state === "on") {
      btn.disabled = true;
      busy("끄는 중…");
      getSub().then(function (sub) {
        if (!sub) { render("off", "알림을 껐어요"); return; }
        var endpoint = sub.endpoint;
        /* 순서가 중요하다 — 브라우저 구독 해지를 먼저 끝내고 서버 기록을 지운다.
           해지가 실패했는데 '꺼짐'으로 그려버리면, 다음 방문에 구독이 그대로 남아
           있어 버튼이 '켜짐'으로 되살아난다(원래 증상).
           반대로 해지만 되고 서버 삭제가 실패하면 발송 때 404/410으로 core.push가
           행을 지우므로 스스로 정리된다. */
        return sub.unsubscribe().then(function (ok) {
          if (ok === false) throw new Error("unsubscribe rejected");
          return post("/push/unsubscribe/", { endpoint: endpoint });
        }).then(function (res) {
          if (!res.ok) throw new Error("server unsubscribe failed");
          render("off", "알림을 껐어요");
        });
      }).catch(function () {
        /* 실패를 숨기지 않는다 — 여전히 켜져 있음을 그대로 보여준다 */
        render("on", "알림 끄기에 실패했어요. 잠시 후 다시 시도해주세요");
      }).finally(function () { btn.disabled = false; });
      return;
    }
    btn.disabled = true;
    busy("설정 중…", "브라우저가 물어보면 '허용'을 눌러주세요");
    navigator.serviceWorker.register("/sw.js").then(function () {
      return Notification.requestPermission().then(function (perm) {
        if (perm !== "granted") {
          render(perm === "denied" ? "blocked" : "off", perm === "denied" ? BLOCKED_HINT : "");
          return;
        }
        busy("등록 중…", "알림 수신 주소를 발급받고 있어요");
        return navigator.serviceWorker.ready.then(function (reg) {
          return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(vapid) });
        }).then(function (sub) {
          return post("/push/subscribe/", sub.toJSON()).then(function (res) {
            if (!res.ok) throw new Error("subscribe failed");
            render("on", "테스트 알림을 보내는 중…");
            return post("/push/test/", {}).then(function (r) {
              return r.json();
            }).then(function (d) {
              setHint(d && d.sent
                ? "테스트 알림을 보냈어요 — 몇 초 안에 도착합니다"
                : "알림은 켜졌어요. 테스트 알림이 안 오면 기기 알림 설정을 확인해주세요");
            }).catch(function () {
              setHint("알림이 켜졌어요");
            });
          });
        });
      });
    }).catch(function () {
      render("off", "알림 설정에 실패했어요. 잠시 후 다시 시도해주세요");
    }).finally(function () { btn.disabled = false; });
  });
})();
</script>
{% endif %}
